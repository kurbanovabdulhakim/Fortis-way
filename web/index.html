<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FortisWay — Грузы ATI.SU и Библиотека</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="vault-header">
      <div class="header-badge">FortisWay Vault</div>
      <h2>Грузы и База Знаний</h2>
      <p class="subtitle" id="sync-status">Синхронизация базы...</p>
    </header>

    <!-- Primary Mode Switcher -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="ati">Грузы ATI.SU (<span id="cnt-ati">0</span>)</button>
      <button class="mode-tab" data-mode="docs">Документы и Архив (<span id="cnt-docs">0</span>)</button>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Поиск по городу, грузу, весу, ТН ВЭД, документу..." autocomplete="off">
    </div>

    <!-- Filter Pills (Wrapped cleanly — works on Desktop & Mobile without stuck scroll!) -->
    <div class="pill-group" id="ati-filters">
      <button class="filter-pill active" data-cat="all">Все грузы</button>
      <button class="filter-pill" data-cat="selected">Избранные</button>
      <button class="filter-pill" data-cat="Китай">Китай</button>
      <button class="filter-pill" data-cat="Турция / Иран / Польша">Турция / Иран / Польша</button>
      <button class="filter-pill" data-cat="РФ / СНГ / Европа">РФ / СНГ / Европа</button>
    </div>

    <!-- Sub-filters (Direction / Body Type for ATI; Category for Docs) -->
    <div class="filter-chips" id="sub-filters">
      <button class="chip active" data-sub="all">Все</button>
      <button class="chip" data-sub="Импорт">Импорт</button>
      <button class="chip" data-sub="Экспорт">Экспорт</button>
      <button class="chip" data-sub="тент">Фура-тент</button>
      <button class="chip" data-sub="реф">Фура-реф</button>
    </div>

    <!-- Items Container -->
    <div class="items-list" id="items-container"></div>
  </div>

  <script src="catalog.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
